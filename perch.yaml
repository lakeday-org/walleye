# Rules perch checks on a scan. Each one is a question put to a model about a method, so these are the things the
# compiler cannot prove: whether a client is answered before its write is safe, whether a count of acknowledgements
# means what its name says. A write path is the one place here where being nearly right is worth nothing, so the
# invariants holding it up are written down rather than left in comments for the next reader to rediscover.

- name: ack-only-when-durable
  where: callers of append
  each: method
  min: 80
  ensure: >
    This method does not tell the client its write succeeded until that write is
    durable. Answering while the rows are still only in memory breaks it, and so
    does answering on the strength of a reply a replica sent before its own
    write reached disk.

- name: durability-is-not-deferred
  where: callers of append
  each: method
  min: 75
  ensure: >
    This method does not hand the saving of a write to a background task and
    then let the client be told it is done. Anything that runs after the client
    has its answer must not be work that answer depended on.

- name: no-shortcut-writes
  where: "crates/**/*.rs"
  ensure_absent: >
    A call to a write that returns before the data reaches disk, such as the
    no-wait variants of put and delete. The engine has never called one and must
    not start.

- name: quorum-counts-only-synced-replicas
  where: mentions ACK_QUORUM
  each: method
  min: 80
  ensure: >
    A replica counts towards the write quorum only if it wrote the record to its
    own disk before replying. A reply that came back before that sync finished
    must not be counted.

- name: quorum-is-two-of-three
  where: mentions ACK_QUORUM
  each: method
  min: 80
  ensure: >
    Anything taking a write quorum requires exactly two and refuses any other
    value rather than accepting it. Two of the three copies is the guarantee
    this engine sells, so it is not a tunable.

- name: search-is-never-disabled
  where: "crates/walleye-node/src/**/*.rs"
  ensure_absent: >
    A handler that refuses vector search or full-text search because the engine
    does not implement it, rather than because the request was malformed. Both
    are search engine features this database sells; a stub that answers "not
    supported yet" is a feature switched off, and it stays off because nothing
    fails while it is. If a search request cannot be served, that is a bug to
    fix and not an error message to return.

- name: index-types-are-not-silently-narrowed
  where: mentions create_index
  each: method
  min: 75
  ensure: >
    This method accepts every index type the storage layer can build - vector
    and full text - and rejects only types that genuinely do not exist. It does
    not accept a request and then build a different kind of index, and it does
    not name one supported type in its error while another is also supported.

- name: text-columns-can-be-searched
  where: mentions full_text_query
  each: method
  min: 75
  ensure: >
    A full-text query over a column with a text index is answered by that index.
    It is not turned into a substring scan, and it is not refused. A phrase
    search that reads every row is a correctness problem as well as a speed one,
    because substring matching and term matching do not return the same rows.

- name: a-claim-checks-the-tail-before-taking-it
  where: callers of claim_epoch
  each: method
  min: 75
  ensure: >
    Anything this method does that could make it refuse the stream happens
    before it claims the writer epoch, not after. Claiming is what fences the
    writer currently holding the stream, so a claim that is then abandoned
    leaves a healthy writer knocked off a stream it was serving correctly. A
    check that runs after the claim is the bug this rule exists for.

- name: an-unreadable-tail-is-refused-not-replayed-empty
  where: "crates/walleye-lance/src/**/*.rs"
  ensure_absent: >
    Opening a stream whose acknowledged, unflushed rows are in a write-ahead
    log this writer cannot read, and serving it as though those rows were not
    there. A replay that finds nothing is not proof that nothing was written;
    it is what a writer on another quorum sees. Refusing is correct, and an
    owner that flushes before it releases the stream is what keeps a later
    open from meeting that refusal. Serving the stream without the rows is
    not, because a client was told they were stored.

- name: unflushed-rows-are-announced-where-others-can-see
  where: mentions note_open_tail
  each: method
  min: 70
  ensure: >
    A writer that acknowledges rows no flush has covered records that fact in
    shared storage before or as it acknowledges them, and removes the record
    only when a checkpoint has put those rows where any writer can read them.
    The shard manifest cannot carry this: it learns positions at flush time and
    names no log. Without the record a successor cannot tell an empty stream
    from one whose tail it simply cannot reach.

- name: a-fenced-writer-is-not-out-for-good
  where: "crates/walleye-node/src/**/*.rs"
  ensure_absent: >
    State that records a stream as taken by a peer and is then used to refuse
    every later open of it for the life of the process. Whether this process
    may open a table's writer is decided by the table's ownership record, which
    moves: an owner whose writer was fenced reopens it, and a process that
    loses a table and later claims it again serves it again. A flag that never
    clears sends clients to retry a process that will never serve them.

- name: acknowledge-only-as-owner
  where: callers of append
  each: method
  min: 75
  ensure: >
    A write is acknowledged only if, after its rows are durable, this process
    still owns the table at the epoch of the writer that took them. Checking
    ownership only before the write lets a process that lost the table while
    the write was in flight tell a client it succeeded.

- name: a-lapsed-lease-is-not-revived
  where: "crates/walleye-node/src/ownership.rs"
  ensure_absent: >
    A lease renewal that extends this process's authority although it was
    issued after that authority had lapsed, or although it took longer than the
    skew allowance to land. Peers call a lease dead from what they have seen
    of it, so a renewal that revives a lapsed session lets a process act as the
    owner of tables a peer has already taken.

- name: ownership-is-judged-on-the-monotonic-clock
  where: "crates/walleye-node/src/ownership.rs"
  ensure_absent: >
    A decision about whether a lease is live, or whether this process is still
    an owner, that reads the wall clock. Two machines' wall clocks disagree and
    either can step; each side may trust only its own monotonic clock, with the
    skew allowance covering the difference in rate.

- name: a-claim-never-displaces-a-live-owner
  where: "crates/walleye-node/src/ownership.rs"
  ensure_absent: >
    A claim of a table whose record names another process with a lease that
    this process has not seen lapse, or a decision to claim made from the last
    sample rather than from a fresh read of the record and the owner's lease.
    A sample can be a renewal behind, and a live owner displaced is two writers.

- name: a-reclaim-waits-before-it-races
  where: mentions discard_fenced_writer
  each: method
  min: 70
  ensure: >
    A writer a peer fenced waits before claiming the stream back, for longer
    each time it is fenced again quickly, and by an amount that is not the same
    on both sides. Two writers that reclaim immediately take the epoch off each
    other faster than either can replay the log behind it, and most writes are
    refused while neither makes progress.

- name: ingest-keeps-bronze-before-deciding
  where: "crates/walleye-node/src/ingest.rs"
  ensure_absent: >
    A path that decides anything about an ingested record - its table, its
    columns, whether it is refused - before the record has been written to
    bronze exactly as it arrived. Every later decision is allowed to be wrong
    because it can be remade from bronze; one made first cannot.

- name: ingest-numbers-are-never-parsed-lossily
  where: "crates/walleye-node/src/ingest/**/*.rs"
  ensure_absent: >
    An ingested number whose digits are carried forward through a floating
    point value - into bronze, the catch-all column, an integer or decimal
    column, or anything a judge is shown - rather than as the text it arrived
    as. Parsing to test whether a value would fit a float column is fine; that
    result is thrown away. Past 2^53 a float has already lost digits, and
    nothing downstream can bring them back.

- name: an-ingest-key-is-never-optional
  where: mentions primary_key
  each: method
  min: 75
  ensure: >
    In the ingest path, a record missing its key, or whose key does not convert
    to the key column's type, is refused into quarantine, and no judgement can
    make the key optional or nullable. A judge decides what a field means; it
    does not get to decide that a record can exist without being identifiable.

- name: ingest-judges-once-not-per-record
  where: "crates/walleye-node/src/ingest.rs"
  ensure_absent: >
    A call to the decision service made once per ingested record, or on the
    path that places records into an already-routed table. A source is judged
    when it is first seen and a table when its shape changes; after that the
    rule decides, or a judge's mistake repeats on every record and costs a
    round trip each time.

- name: ingest-column-cap-is-code
  where: "crates/walleye-node/src/ingest.rs"
  ensure_absent: >
    Any way for a table built by the ingest path to exceed MAX_COLUMNS because
    a judge said so, or because a judge was unavailable. Records keyed by ids
    would otherwise make one column per id, and the cap is what stops a single
    wrong call doing that.

- name: ingestion-never-waits-on-the-embedding-model
  where: "crates/walleye-node/src/ingest.rs"
  ensure_absent: >
    A path where an embedding model that is slow, down or refusing makes an
    ingest request fail or leaves its rows unwritten. Rows are written with
    their vectors empty and filled in later. A search index that is behind
    for a while is a far smaller failure than a stream that stops accepting
    rows.

- name: an-alarm-fires-only-as-owner
  where: mentions update_alarms
  each: method
  min: 75
  ensure: >
    A firing begins with a write to the alarm's key's ownership record, made
    through the ownership compare-and-swap, before the handler runs. Deciding
    to fire from what was loaded earlier, or from a local copy, without that
    write, lets a process that has lost the key run its alarms beside the new
    owner.

- name: one-firing-per-occurrence
  where: "crates/walleye-node/src/**/*.rs"
  ensure_absent: >
    Scheduled work run by a timer, a polling loop or a per-node task that does
    not go through an alarm on the owner of its key. Anything that decides
    when work runs outside the alarms runs once per process instead of once
    per occurrence, and does not survive the process.

- name: a-schedule-that-fell-behind-runs-once
  where: "crates/walleye-node/src/alarms.rs"
  ensure_absent: >
    A schedule that missed several occurrences running once for each of them,
    or dropping them without saying so. One run stands for the latest missed
    time and reports how many it covers.

- name: a-hand-back-only-moves-a-key-to-where-it-belongs
  where: mentions hand_back
  each: method
  min: 75
  ensure: >
    A process gives a key back only while it holds more than its fair share,
    only a key whose placement is another live process, one key per sweep, and
    only between alarm firings. Moving a key anywhere but to its placement, or
    moving keys a process is placed to hold, is what turns rebalancing into
    keys moving for ever.

- name: a-replica-counts-only-for-positions-it-holds
  where: mentions catch_up_member
  each: method
  min: 75
  ensure: >
    A replica counts towards a write quorum only for positions it actually
    holds: an append is acknowledged by a member only when the member holds
    the predecessor, and a member behind is caught up before it is counted,
    never counted while it is still catching up. Catch-up copies only records
    that are committed and agree across their copies, in LSN order, and
    withdraws a member's own record only when a newer writer's committed
    record replaced it. Counting a member for a position it lacks, or copying
    an uncommitted record, lets a second failure lose an acknowledged write.

- name: a-writer-levels-a-member-only-with-what-it-acknowledged
  where: mentions bring_level
  each: method
  min: 75
  ensure: >
    Bringing a member level from a writer's own records sends only records
    that writer acknowledged with a quorum, in LSN order, and counts a record
    the member already holds as held only where it equals the acknowledged
    record or the member's peers vouched for it. Anything else - a record the
    writer lacks, or one that differs - goes through catch-up from the peers.
    Sending past an unchecked record can chain committed records onto an
    orphan the member kept from a dead writer.

- name: replica-state-stays-the-size-of-its-window
  where: "crates/walleye-bitr-server/src/**/*.rs"
  ensure_absent: >
    State kept for as long as a stream lives that grows with every record or
    every archive pass: a list in the archive head, or a map in a
    coordinator's memory, that is appended to and never folded, pruned or
    bounded. The archive head is read and rewritten by every member on every
    pass, and a coordinator runs for months, so either one growing with
    history slows every pass and eventually exhausts memory.

- name: nothing-reads-the-log-from-the-start
  where: "crates/**/src/**/*.rs"
  ensure_absent: >
    A read of a stream's replicated log from LSN 0 - `recover(stream, 0)` or
    an equivalent - on a path that runs per claim, per open, per pass or per
    request. Its cost grows with the table's age, and below a durable
    checkpoint the log has been released and the read is refused. Ask for the
    stream's extent, or read from the checkpoint.

- name: a-release-never-outruns-a-durable-checkpoint
  where: mentions release
  each: method
  min: 75
  ensure: >
    The replicated log is released only through a position a published,
    durable table checkpoint covers, never past the archived tail, and never
    backwards; the archive head records the release before any segment or
    index page below it is deleted, and nothing the head still names is
    deleted.

- name: the-log-decides-where-the-next-entry-goes
  where: mentions next_position_for_lance
  each: method
  min: 75
  ensure: >
    The position of a table's next log entry comes from the replicated log's
    own tail, or the table's durable checkpoint where that is further; never
    from Lance's manifest cursor alone, which is a hint that can outrun what
    the log still holds. Trusting the hint past the log's tail leaves a table
    that refuses every open.

- name: a-stopping-replica-archives-before-it-exits
  where: "crates/walleye-bitr-server/src/daemon.rs"
  ensure_absent: >
    A replica process that stops without a final archive pass of everything
    it holds committed, or a host that ends the process without waiting for
    it. A stopped instance's volumes are deleted; what the archive does not
    hold is gone.

- name: nothing-done-means-nothing-was-sent
  where: mentions owner-unreachable
  each: method
  min: 75
  ensure: >
    A route error whose contract is that nothing was applied -
    `owner-unreachable`, `no-owner`, `stale-owner` - is returned only when no
    attempt could have delivered the request: every attempt failed to
    connect, or the answer came from a process that refused it. Once any
    attempt may have delivered it, the answer is `outcome-unknown`, and a
    request that is not safe to repeat is not sent again.
