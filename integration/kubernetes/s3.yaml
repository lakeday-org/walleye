apiVersion: v1
kind: Service
metadata:
  name: minio
spec:
  selector: {app: minio}
  ports:
    - {port: 9000, targetPort: 9000}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
spec:
  replicas: 1
  selector:
    matchLabels: {app: minio}
  template:
    metadata:
      labels: {app: minio}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: minio
          image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
          args: [server, /data]
          env:
            - {name: MINIO_ROOT_USER, value: walleye-local}
            - {name: MINIO_ROOT_PASSWORD, value: walleye-local-secret}
          ports:
            - {containerPort: 9000}
          readinessProbe:
            httpGet: {path: /minio/health/live, port: 9000}
            periodSeconds: 2
          volumeMounts:
            - {name: data, mountPath: /data}
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: s3-buckets
spec:
  backoffLimit: 12
  template:
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      containers:
        - name: buckets
          image: quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z
          command: [/bin/sh, -ec]
          args:
            - mc alias set local http://minio:9000 walleye-local walleye-local-secret && mc mb --ignore-existing local/walleye-data local/walleye-archive
