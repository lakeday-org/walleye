apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: walleye-cache
spec:
  serviceName: walleye-cache
  replicas: 3
  podManagementPolicy: Parallel
  persistentVolumeClaimRetentionPolicy: {whenDeleted: Delete, whenScaled: Delete}
  selector:
    matchLabels: {app: walleye-cache}
  template:
    metadata:
      labels: {app: walleye-cache}
    spec:
      serviceAccountName: walleye-cache
      terminationGracePeriodSeconds: 120
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels: {app: walleye-cache}
                topologyKey: kubernetes.io/hostname
      containers:
        - name: walleye
          image: walleye:local
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: {name: walleye-config}
            - secretRef: {name: walleye-secrets}
          env:
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: POD_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
            - {name: WALLEYE_DISCOVERY_SERVICE, value: walleye-cache}
            - {name: WALLEYE_BITR_URL, value: "http://walleye-bitr-gateway:30080"}
          ports:
            - {name: cache, containerPort: 8080}
          resources:
            requests: {cpu: 500m, memory: 512Mi}
            limits: {cpu: "2", memory: 2Gi}
          startupProbe:
            httpGet: {path: /healthz, port: cache}
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /healthz, port: cache}
            periodSeconds: 2
          livenessProbe:
            httpGet: {path: /healthz, port: cache}
            periodSeconds: 10
          volumeMounts:
            - {name: cache, mountPath: /data}
  volumeClaimTemplates:
    - metadata: {name: cache}
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 2Gi}
