apiVersion: v1
kind: Service
metadata:
  name: walleye-bitr
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector: {app: walleye-bitr}
  ports:
    - {name: replica, port: 9090, targetPort: 9090}
---
apiVersion: v1
kind: Service
metadata:
  name: walleye-bitr-gateway
spec:
  selector: {app: walleye-bitr}
  ports:
    - {name: gateway, port: 30080, targetPort: 30080}
---
apiVersion: v1
kind: Service
metadata:
  name: walleye-cache
spec:
  clusterIP: None
  selector: {app: walleye-cache}
  ports:
    - {name: cache, port: 8080, targetPort: 8080}
---
apiVersion: v1
kind: Service
metadata:
  name: walleye-api
spec:
  selector:
    app: walleye-cache
  ports:
    - {name: http, port: 8080, targetPort: 8080}
