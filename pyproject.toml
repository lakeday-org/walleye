[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "declank"
version = "0.7.0"
license = "MIT"
description = "Tree-sitter powered, multi-language Halstead code quality scanner"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "tree-sitter==0.25.2",
  "tree-sitter-language-pack==0.13.0",
  "pathspec>=0.12,<2",
  "rich>=13,<15",
  "sqlfluff==4.3.0",
  "networkx>=3.4,<4",
  "quickjs==1.19.4",
  "pyjwt[crypto]>=2.10,<3",
]

[project.scripts]
declank = "declank.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
