[package]
name = "walleye-bitr-server"
version = "0.1.0"
edition = "2024"
publish = false


[dependencies]
async-trait = "0.1.89"
axum = "0.8.8"
base64 = "0.22.1"
bytes = "1.10.1"
futures = "0.3.31"
hex = "0.4.3"
hmac = "0.12.1"
libc = "0.2"
object_store = { version = "0.14.0", features = ["aws"] }
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
tokio = { version = "1.49.0", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
thiserror = "2.0.18"
walleye-bitr.workspace = true

[dev-dependencies]
tempfile = "3.20.0"
tower = "0.5.2"

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"
