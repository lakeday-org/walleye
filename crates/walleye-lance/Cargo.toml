[package]
name = "walleye-lance"
description = "Lance MemWAL storage over the Bitr quorum durability plane"
version.workspace = true
edition.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
walleye-cache.workspace = true
lance-core = "=11.0.0"
lance-io = { version = "=11.0.0", default-features = false, features = ["aws"] }
object_store = "=0.13.2"
arrow-array.workspace = true
arrow-data = "58"
arrow-ipc.workspace = true
arrow-schema.workspace = true
async-trait.workspace = true
bytes.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
uuid.workspace = true
walleye-bitr.workspace = true

# The root workspace pins and patches Lance. The dependency is intentionally
# direct: this crate owns the production Lance integration and explicitly
# selects either object-store CAS or Bitr as its WAL authority.
lance = { path = "../../vendor/lance", default-features = false, features = ["aws"] }
lance-linalg = "=11.0.0"

[dev-dependencies]
datafusion-execution = "=54.1.0"
tokio.workspace = true
tempfile.workspace = true

[lints]
workspace = true
